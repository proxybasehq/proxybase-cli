name: proxybase-cli Release

on:
  push:
    tags:
      - "proxybase-cli-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release Asset (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_ext: tar.gz
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_ext: zip
            exe_suffix: ".exe"
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_ext: tar.gz
            exe_suffix: ""

    steps:
      - name: Checkout proxybase-cli
        uses: actions/checkout@v4

      - name: Checkout libproxybase
        uses: actions/checkout@v4
        with:
          repository: proxybasehq/libproxybase
          path: libproxybase

      - name: Link libproxybase (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$PWD/libproxybase" "$GITHUB_WORKSPACE/../libproxybase"

      - name: Link libproxybase (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mklink /J ..\libproxybase libproxybase

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Ensure Cargo.lock exists
        shell: bash
        run: |
          if [[ ! -f Cargo.lock ]]; then
            cargo generate-lockfile
          fi

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="proxybase-cli"
          BIN_PATH="target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe_suffix }}"
          mkdir -p dist

          if [[ "${{ matrix.artifact_ext }}" == "zip" ]]; then
            7z a "dist/${BIN_NAME}-${{ matrix.target }}.zip" "$BIN_PATH"
          else
            tar -C "$(dirname "$BIN_PATH")" -czf "dist/${BIN_NAME}-${{ matrix.target }}.tar.gz" "$(basename "$BIN_PATH")"
          fi

          # Raw binary for the self-updater (name must match update.rs asset_for)
          cp "$BIN_PATH" "dist/${BIN_NAME}-${{ matrix.target }}${{ matrix.exe_suffix }}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum proxybase-cli-x86_64-unknown-linux-gnu \
                    proxybase-cli-x86_64-pc-windows-msvc.exe \
                    proxybase-cli-aarch64-apple-darwin > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker-publish:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proxybase-cli
        uses: actions/checkout@v4
        with:
          path: proxybase-cli

      - name: Checkout libproxybase
        uses: actions/checkout@v4
        with:
          repository: proxybasehq/libproxybase
          path: libproxybase

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/proxybase-cli
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./proxybase-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

